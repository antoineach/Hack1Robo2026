<script>
(() => {
  const root = document.getElementById('hack1robo-evolution');
  const runs = JSON.parse(document.getElementById('hack1robo-evolution-data').textContent);
  const select = root.querySelector('[data-run]');
  const plot = root.querySelector('[data-plot]');
  const phases = root.querySelector('[data-phases]');
  const position = root.querySelector('[data-position]');
  const token = root.querySelector('[data-token]');
  const play = root.querySelector('[data-play]');
  const prefix = root.querySelector('[data-prefix]');
  const progressiveText = root.querySelector('[data-story-progress]');
  const fullText = root.querySelector('[data-full-text]');
  const judge = root.querySelector('[data-judge]');
  const notes = root.querySelector('[data-notes]');
  const review = root.querySelector('[data-review]');
  const evidenceList = root.querySelector('[data-evidence]');
  const num = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
  const lineColor = 'var(--viz-series-1)';
  const entropyColor = 'var(--viz-series-2)';
  const neutral = 'var(--border)';
  const axisColor = 'var(--muted-foreground)';
  const svgNamespace = 'http://www.w3.org/2000/svg';
  const entropyMax = Math.max(8, Math.ceil(Math.max(...runs.flatMap(run => run.entropies)) / 2) * 2);
  const temperatureMax = Math.max(1.6, Math.ceil(Math.max(...runs.flatMap(run => run.temperatures)) * 4) / 4);
  let selectedEvidence = null;
  let replayTimer = null;
  let replayStarted = false;

  const node = (name, attrs, value) => {
    const element = document.createElementNS(svgNamespace, name);
    for (const [attr, attrValue] of Object.entries(attrs)) element.setAttribute(attr, attrValue);
    if (value !== undefined) element.textContent = value;
    return element;
  };

  for (const [index, run] of runs.entries()) select.add(new Option(run.label, index));

  function renderPlot(run) {
    if (plot.clientWidth < 20) return;
    const width = plot.clientWidth;
    const left = 39;
    const right = width - 14;
    const tEnd = run.temperatures.length - 1;
    const x = token => left + token / tEnd * (right - left);
    const series = run.entropies.map((_, i) => {
      const sample = run.entropies.slice(Math.max(0, i - 4), i + 5);
      return sample.reduce((total, value) => total + value, 0) / sample.length;
    });
    const upper = value => 117 - value / temperatureMax * 89;
    const lower = value => 231 - value / entropyMax * 80;
    const svg = node('svg', { viewBox: `0 0 ${width} 266`, role: 'img',
      'aria-label': `Température et entropie selon la position du token, ${run.label}` });
    const draw = (name, attrs, value) => svg.appendChild(node(name, attrs, value));
    const number = (px, py, value, anchor = 'start', fill = axisColor) => draw('text', {
      x: px, y: py, 'text-anchor': anchor, fill, 'font-size': 12,
    }, value);
    const grid = (x1, y1, x2, y2, stroke = neutral, extra = {}) => {
      draw('line', { x1, x2, y1, y2, stroke, ...extra });
    };

    for (const [i, phase] of run.phases.entries()) {
      if (i % 2 === 0) draw('rect', {
        x: x(phase.from), y: 25, width: Math.max(0, x(phase.to + (i === 3 ? 0 : 1)) - x(phase.from)),
        height: 206, fill: 'var(--muted)', opacity: .42,
      });
    }
    if (selectedEvidence) {
      const first = x(Math.max(0, selectedEvidence.start - .5));
      const last = x(Math.min(tEnd, selectedEvidence.end + .5));
      draw('rect', {
        x: first, y: 25, width: Math.max(2, last - first), height: 206,
        fill: 'var(--viz-series-3)', opacity: .17, 'pointer-events': 'none',
      });
    }

    number(left, 15, 'Température', 'start', 'var(--foreground)');
    number(left, 139, 'Entropie (nats)', 'start', 'var(--foreground)');

    for (const [ticks, y] of [[[0, .4, .8, 1.2, 1.6], upper], [[0, entropyMax / 2, entropyMax], lower]]) {
      for (const tick of ticks) {
        grid(left, y(tick), right, y(tick));
        number(left - 6, y(tick) + 4, num.format(tick), 'end');
      }
    }
    const xTicks = width > 550 ? [0, 20, 40, 60, 80, 100, 120, 140] : [0, 35, 70, 105, 140];
    for (const tick of xTicks.filter(tick => tick <= tEnd)) {
      grid(x(tick), 231, x(tick), 236);
      number(x(tick), 249, String(tick), 'middle');
    }
    number((left + right) / 2, 265, 'Position du token', 'middle');
    if (!run.constant) {
      for (const mark of [run.onset, run.peak, run.crash]) {
        grid(x(mark), 25, x(mark), 231, axisColor, { 'stroke-dasharray': '3 4', opacity: .45 });
      }
    }
    function line(values, y, stroke, strokeWidth, opacity = 1) {
      draw('polyline', {
        points: values.map((value, index) => `${x(index)},${y(value)}`).join(' '),
        fill: 'none', stroke, 'stroke-width': strokeWidth, opacity,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      });
    }
    line(run.entropies, lower, entropyColor, 1, .33);
    line(series, lower, entropyColor, 2);
    line(run.temperatures, upper, lineColor, 2.2);
    for (const t of run.constant ? [0] : [0, run.peak, run.crash]) {
      const value = run.temperatures[t];
      draw('circle', { cx: x(t), cy: upper(value), r: 3.3, fill: lineColor });
      number(x(t) + 6, upper(value) - 7, num.format(value), 'start', 'var(--foreground)');
    }
    const cursor = Number(position.value);
    grid(x(cursor), 25, x(cursor), 231, axisColor, { opacity: .66 });
    draw('circle', { cx: x(cursor), cy: lower(run.entropies[cursor]), r: 3, fill: entropyColor });
    plot.replaceChildren(svg);
  }

  function selectedRun() {
    return runs[Number(select.value)];
  }

  function inspectToken() {
    const run = selectedRun();
    const cursor = Number(position.value);
    const piece = run.pieces[cursor].trim() || 'espace';
    token.textContent = `Token ${cursor} · « ${piece} » · T = ${num.format(run.temperatures[cursor])} · Entropie ${num.format(run.entropies[cursor])} nats`;
    const text = run.text.slice(0, run.cutoffs[cursor]);
    if (selectedEvidence) {
      const { charStart, charEnd } = selectedEvidence;
      const highlight = document.createElement('mark');
      highlight.textContent = text.slice(charStart, charEnd);
      progressiveText.replaceChildren(text.slice(0, charStart), highlight, text.slice(charEnd));
    } else {
      progressiveText.textContent = text;
    }
    renderPlot(run);
  }

  function stopReplay(buttonLabel = 'Rejouer la génération') {
    clearInterval(replayTimer);
    replayTimer = null;
    token.setAttribute('aria-live', 'polite');
    play.textContent = buttonLabel;
  }

  function replay() {
    if (replayTimer !== null) {
      stopReplay('Reprendre la lecture');
      return;
    }
    selectedEvidence = null;
    if (!replayStarted) position.value = 0;
    replayStarted = true;
    play.textContent = 'Mettre en pause';
    token.setAttribute('aria-live', 'off');
    inspectToken();
    replayTimer = setInterval(() => {
      position.value = Number(position.value) + 1;
      inspectToken();
      if (Number(position.value) >= Number(position.max)) {
        replayStarted = false;
        stopReplay();
      }
    }, 90);
  }

  function renderJudge(run) {
    judge.hidden = !run.judge;
    if (!run.judge) return;
    const score = run.judge;
    notes.textContent = `Cohérence ${score.coherence}/5 · Originalité ${score.originalite}/5 · Progression ${score.progression}/5`;
    review.textContent = score.commentaire;
    const buttons = run.evidence.map(evidence => {
      const button = document.createElement('button');
      button.className = 'btn';
      button.type = 'button';
      button.textContent = `« ${evidence.quote} » · t${evidence.start}–${evidence.end}`;
      button.addEventListener('click', () => {
        stopReplay();
        replayStarted = false;
        selectedEvidence = evidence;
        position.value = evidence.end;
        inspectToken();
      });
      return button;
    });
    evidenceList.replaceChildren(...buttons);
  }

  function render() {
    const run = selectedRun();
    stopReplay();
    replayStarted = false;
    selectedEvidence = null;
    position.max = run.temperatures.length - 1;
    position.value = run.peak;
    inspectToken();
    renderJudge(run);
    const segments = [];
    for (const phase of run.phases) {
      const article = document.createElement('article');
      const label = document.createElement('h3');
      label.textContent = phase.name;
      const interval = document.createElement('div');
      interval.className = 'text-small text-muted';
      interval.textContent = `Tokens ${phase.from}–${phase.to} · T ${phase.range}`;
      const excerpt = document.createElement('blockquote');
      excerpt.textContent = phase.excerpt;
      article.append(label, interval, excerpt);
      segments.push(article);
    }
    phases.replaceChildren(...segments);
    prefix.hidden = !run.prefix;
    prefix.textContent = run.prefix ? `Amorce fournie · « ${run.prefix} »` : '';
    fullText.textContent = run.text;
  }

  select.addEventListener('change', render);
  position.addEventListener('input', () => {
    stopReplay();
    replayStarted = false;
    selectedEvidence = null;
    inspectToken();
  });
  play.addEventListener('click', replay);
  new ResizeObserver(() => renderPlot(selectedRun())).observe(plot);
  render();
})();
</script>
